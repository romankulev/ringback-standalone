<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07111f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Ringback — защищённые WebRTC-звонки с вашим AI-агентом в Telegram." />
    <title>Ringback</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body data-state="connecting">
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Ringback">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M7.1 3.7 9.4 7c.4.6.3 1.4-.2 1.9l-1.4 1.3a14.1 14.1 0 0 0 6 6l1.3-1.4c.5-.5 1.3-.6 1.9-.2l3.3 2.3c.6.4.8 1.2.5 1.8l-.8 1.8c-.3.7-1 1.1-1.8 1.1A16.8 16.8 0 0 1 2.4 5.8c0-.8.4-1.5 1.1-1.8l1.8-.8c.6-.3 1.4-.1 1.8.5Z" />
              <path class="brand__spark" d="M14.8 3.2c2.9.8 5.2 3.1 6 6M14.6 6.8c1.7.5 3.1 1.9 3.6 3.6" />
            </svg>
          </span>
          <span class="brand__wordmark">Ringback</span>
        </div>

        <div class="connection-pill" id="connectionPill" data-online="false">
          <span class="connection-pill__dot" aria-hidden="true"></span>
          <span id="connectionLabel">Подключение</span>
        </div>
      </header>

      <aside class="offline-banner" id="offlineBanner" role="status" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.8 8.9a14.1 14.1 0 0 1 18.4 0M6.3 12.4a8.9 8.9 0 0 1 11.4 0M9.8 15.9a3.7 3.7 0 0 1 4.4 0M3 3l18 18" />
        </svg>
        <span>Нет интернета. Ждём возвращения сети…</span>
      </aside>

      <main class="call-stage" aria-labelledby="stateTitle">
        <section class="hero" aria-live="polite" aria-atomic="true">
          <div class="avatar-wrap" aria-hidden="true">
            <span class="ring ring--outer"></span>
            <span class="ring ring--middle"></span>
            <span class="ring ring--inner"></span>
            <div class="avatar">
              <svg class="avatar__bot" viewBox="0 0 48 48">
                <path d="M24 8v5" />
                <circle cx="24" cy="6" r="2" />
                <rect x="10" y="13" width="28" height="25" rx="10" />
                <path d="M10 24H7v8h4M38 24h3v8h-4" />
                <circle cx="19" cy="25" r="2" />
                <circle cx="29" cy="25" r="2" />
                <path d="M19 32c2.8 2 7.2 2 10 0" />
              </svg>
              <svg class="avatar__phone" viewBox="0 0 48 48">
                <path d="m14 10 6 8-4 4c3 5 6 8 11 11l4-4 8 6-3 5c-.7 1.2-2.1 1.9-3.5 1.6C19 39 9 29 6.4 15.5 6.1 14.1 6.8 12.7 8 12l6-2Z" />
              </svg>
              <svg class="avatar__check" viewBox="0 0 48 48">
                <path d="m14 25 7 7 14-16" />
              </svg>
              <svg class="avatar__error" viewBox="0 0 48 48">
                <path d="M24 14v13M24 34h.01" />
              </svg>
            </div>
          </div>

          <p class="eyebrow" id="stateEyebrow">Защищённый канал</p>
          <h1 id="stateTitle">Подключаемся…</h1>
          <p class="state-copy" id="stateCopy">Готовим звонки с вашим AI-агентом</p>

          <div class="call-note" id="callNote" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" />
              <path d="M12 11v5M12 8h.01" />
            </svg>
            <span id="callNoteText"></span>
          </div>

          <div class="call-meta" aria-label="Данные звонка">
            <span class="timer" id="callTimer">00:00</span>
            <span class="muted-badge" id="mutedBadge" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 9v3a3 3 0 0 0 4.7 2.5M15 10V7a3 3 0 0 0-5.8-1M17 12a5 5 0 0 1-.4 2M7 12a5 5 0 0 0 8.5 3.6M12 17v4M9 21h6M3 3l18 18" />
              </svg>
              Микрофон выключен
            </span>
          </div>

          <div class="voice-bars" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </section>

        <section class="controls" aria-label="Управление звонком">
          <div class="controls__group controls__group--idle">
            <button class="primary-action" id="startCallButton" type="button">Позвонить ассистенту</button>
          </div>

          <div class="controls__group controls__group--incoming">
            <button class="call-button call-button--decline" id="declineButton" type="button">
              <span class="call-button__icon">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 14c6.6-4 13.4-4 20 0l-2.3 6-5-1v-4.5a17 17 0 0 0-5.4 0V19l-5 1L6 14Z" /></svg>
              </span>
              <span>Отклонить</span>
            </button>
            <button class="call-button call-button--accept" id="acceptButton" type="button">
              <span class="call-button__icon">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 5c-1 0-3.5 2-3 5.5C7.3 19 13 24.7 21.5 26c3.5.5 5.5-2 5.5-3l-6-4-3 3c-3.7-1.8-6.2-4.3-8-8l3-3-4-6Z" /></svg>
              </span>
              <span>Принять</span>
            </button>
          </div>

          <div class="controls__group controls__group--connecting">
            <button class="call-button call-button--hangup" id="cancelButton" type="button">
              <span class="call-button__icon">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 14c6.6-4 13.4-4 20 0l-2.3 6-5-1v-4.5a17 17 0 0 0-5.4 0V19l-5 1L6 14Z" /></svg>
              </span>
              <span>Отменить</span>
            </button>
          </div>

          <div class="controls__group controls__group--active">
            <button class="call-button call-button--neutral" id="muteButton" type="button" aria-pressed="false">
              <span class="call-button__icon">
                <svg class="icon-mic" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4a4 4 0 0 0-4 4v8a4 4 0 0 0 8 0V8a4 4 0 0 0-4-4ZM8 15v1a8 8 0 0 0 16 0v-1M16 24v5M12 29h8" /></svg>
                <svg class="icon-mic-off" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 12v4a4 4 0 0 0 6.4 3.2M20 14V8a4 4 0 0 0-7.7-1.5M24 15v1a8 8 0 0 1-.8 3.5M8 15v1a8 8 0 0 0 12 6.9M16 24v5M12 29h8M5 5l22 22" /></svg>
              </span>
              <span id="muteLabel">Выкл. микрофон</span>
            </button>
            <button class="call-button call-button--hangup" id="hangupButton" type="button">
              <span class="call-button__icon">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 14c6.6-4 13.4-4 20 0l-2.3 6-5-1v-4.5a17 17 0 0 0-5.4 0V19l-5 1L6 14Z" /></svg>
              </span>
              <span>Завершить</span>
            </button>
          </div>

          <div class="controls__group controls__group--finished">
            <button class="primary-action" id="doneButton" type="button">Готово</button>
          </div>

          <div class="controls__group controls__group--error">
            <button class="primary-action" id="retryButton" type="button">Повторить</button>
          </div>
        </section>

        <button class="audio-gate" id="audioGate" type="button" hidden>
          <span class="audio-gate__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5ZM17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11" /></svg>
          </span>
          <span><b>Включить звук</b><small>Telegram ждёт вашего касания</small></span>
        </button>
      </main>

      <footer class="privacy-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6V10Z" /><path d="M12 14v2" /></svg>
        <span>Аудио обрабатывает ElevenLabs, диалог — OpenAI</span>
      </footer>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>
    <p class="sr-only" id="announcer" aria-live="assertive"></p>
  </body>
</html>
